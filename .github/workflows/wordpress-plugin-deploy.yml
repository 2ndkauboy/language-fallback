name: Deploy to WordPress.org
on:
  release:
    types: [published]

permissions:
  contents: write # needed to attach the built archive to the release

jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Upload release asset
        # `actions/upload-release-asset`, which used to do this, was archived upstream in
        # 2021. The `gh` CLI is preinstalled on the runner and needs no pin of its own.
        # `#<name>` keeps the asset named after the repository regardless of what the
        # deploy action called the file, and `--clobber` makes a re-run idempotent.
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.deploy.outputs.zip-path }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$ZIP_PATH#${{ github.event.repository.name }}.zip" --clobber
