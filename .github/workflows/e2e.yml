name: E2E Tests

on:
  pull_request:
    paths:
      - '**.php'
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'tests/e2e/**'
      - '.wp-env.json'
      - '.github/workflows/e2e.yml'
  push:
    branches:
      - develop
      - stable

jobs:
  e2e:
    name: WordPress ${{ matrix.label }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '7.1'
            core: 'WordPress/WordPress#7.1'
          - label: 'trunk'
            core: 'WordPress/WordPress#master'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install Node dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Select the WordPress version
        run: |
          echo '{ "core": "${{ matrix.core }}" }' > .wp-env.override.json

      - name: Start the WordPress environment
        run: npm run env:start

      - name: Run the E2E tests
        run: npm run test:e2e

      - name: Upload the artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.label }}
          path: artifacts
          retention-days: 7

      - name: Stop the WordPress environment
        if: always()
        run: npm run env:stop
